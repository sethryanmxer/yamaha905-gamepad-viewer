<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YAMAHA905 Xbox Controller Viewer</title>
<style>
:root{--blue:#12a9ff;--white:#f2f9ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:var(--white);font-family:Arial,sans-serif;overflow:hidden}body{display:grid;place-items:center}.viewer{width:min(100vw,1120px);padding:14px 22px;position:relative}.panel{position:absolute;inset:3% 1% 2%;border:1px solid #12a9ff66;border-radius:26px;background:linear-gradient(145deg,#030f1ceB,#041f34c9,#020a14eb);box-shadow:0 0 35px #008cff25,inset 0 0 35px #008cff14;z-index:-1}header,footer{display:flex;align-items:center;justify-content:space-between;padding:3px 18px;gap:12px}.brand{font-size:clamp(17px,2.7vw,26px);font-weight:900;letter-spacing:.16em;text-shadow:0 0 14px #12a9ff88}.brand span{color:var(--blue)}.sub,.foot{font-size:10px;letter-spacing:.2em;color:#85b7d5;margin-top:4px}.status{font-size:11px;letter-spacing:.12em;color:#ffc96e;white-space:nowrap}.status.on{color:#7cf4c0;text-shadow:0 0 10px #00d98a}svg{width:100%;height:auto;max-height:74vh;display:block;overflow:visible}.shell{fill:url(#shellGrad);stroke:#398fbd;stroke-width:4}.shell-edge{fill:none;stroke:#b1e7ff35;stroke-width:2}.trim{fill:none;stroke:#12a9ff;stroke-width:4;filter:url(#glow)}.trigger{fill:#10283b;stroke:#428ab3;stroke-width:3}.trigger-fill{fill:#12a9ff;opacity:.8}.stick-base{fill:#091522;stroke:#4d8fb5;stroke-width:7}.stick{fill:url(#stickGrad);stroke:#9bdcff;stroke-width:3;filter:url(#glow)}.btn{fill:#102a40;stroke:#72a9c8;stroke-width:2.5;transition:fill .06s}.btn.active,.dpad.active{fill:#10aaff;stroke:#e2f8ff;filter:url(#glow)}.btntext{fill:#d9f3ff;font-size:22px;font-weight:900;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.btntext.active{fill:#fff;filter:url(#glow)}.dpad{fill:#183d56;stroke:#85c9ec;stroke-width:2}.caption{fill:#83b9d7;font-size:13px;letter-spacing:3px;text-anchor:middle}.logo-ring{fill:#071522;stroke:#28baff;stroke-width:3;filter:url(#glow)}@media(max-width:620px){.viewer{padding:10px 5px}header,footer{padding:2px 8px}.sub,.foot{font-size:8px}.status{font-size:9px}}
</style></head><body><main class="viewer"><div class="panel"></div>
<header><div><div class="brand">YAMAHA<span>905</span></div><div class="sub">LIVE INPUT // XBOX CONTROLLER</div></div><div id="status" class="status">● WAITING FOR CONTROLLER</div></header>
<svg viewBox="0 0 1000 590" role="img" aria-label="Xbox controller with live button input display"><defs>
<linearGradient id="shellGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b4059"/><stop offset=".48" stop-color="#0b1d2d"/><stop offset="1" stop-color="#193b52"/></linearGradient><linearGradient id="stickGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#416b84"/><stop offset="1" stop-color="#10283c"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<path class="shell" d="M252 118 C194 118 153 155 133 220 L69 427 C49 493 101 548 164 518 L307 429 C352 401 402 390 500 390 C598 390 648 401 693 429 L836 518 C899 548 951 493 931 427 L867 220 C847 155 806 118 748 118 L591 130 Q500 164 409 130 Z"/><path class="shell-edge" d="M171 224 Q194 143 258 143 L411 154 Q500 181 589 154 L742 143 Q806 143 829 224"/><path class="trim" d="M118 410 L178 228 Q196 174 237 161 M882 410 L822 228 Q804 174 763 161"/>
<path class="trigger" d="M232 119 Q300 91 374 126 L365 158 Q298 136 243 157Z"/><path class="trigger" d="M626 126 Q700 91 768 119 L757 157 Q702 136 635 158Z"/><rect class="trigger" x="250" y="78" width="120" height="22" rx="10"/><rect class="trigger" x="630" y="78" width="120" height="22" rx="10"/><rect id="lt-fill" class="trigger-fill" x="250" y="78" width="0" height="22" rx="10"/><rect id="rt-fill" class="trigger-fill" x="630" y="78" width="0" height="22" rx="10"/><text class="caption" x="310" y="65">LT</text><text class="caption" x="690" y="65">RT</text><text class="caption" x="302" y="119">LB</text><text class="caption" x="698" y="119">RB</text>
<circle class="stick-base" cx="350" cy="286" r="57"/><circle id="leftStick" class="stick" cx="350" cy="286" r="31"/><text class="caption" x="350" y="365">LEFT STICK</text>
<g transform="translate(220 365)"><path id="dpad-up" class="dpad" d="M-19 -54 H19 V-18 H-19Z"/><path id="dpad-down" class="dpad" d="M-19 18 H19 V54 H-19Z"/><path id="dpad-left" class="dpad" d="M-54 -19 H-18 V19 H-54Z"/><path id="dpad-right" class="dpad" d="M18 -19 H54 V19 H18Z"/><rect x="-18" y="-18" width="36" height="36" rx="5" fill="#102c41"/></g>
<circle id="button-8" class="btn" cx="432" cy="220" r="17"/><circle id="button-9" class="btn" cx="568" cy="220" r="17"/><text class="caption" x="432" y="253">VIEW</text><text class="caption" x="568" y="253">MENU</text><circle class="logo-ring" cx="500" cy="222" r="27"/><path d="M486 210 Q500 198 514 210 L508 219 Q500 212 492 219Z M486 233 Q500 245 514 233 L508 224 Q500 231 492 224Z" fill="#d9f5ff"/><text class="caption" x="500" y="290">YAMAHA905</text>
<circle class="stick-base" cx="600" cy="390" r="57"/><circle id="rightStick" class="stick" cx="600" cy="390" r="31"/><text class="caption" x="600" y="468">RIGHT STICK</text>
<circle id="button-3" class="btn" cx="752" cy="250" r="25"/><text id="label-3" class="btntext" x="752" y="250">Y</text><circle id="button-1" class="btn" cx="795" cy="305" r="25"/><text id="label-1" class="btntext" x="795" y="305">B</text><circle id="button-0" class="btn" cx="709" cy="305" r="25"/><text id="label-0" class="btntext" x="709" y="305">A</text><circle id="button-2" class="btn" cx="752" cy="360" r="25"/><text id="label-2" class="btntext" x="752" y="360">X</text>
</svg><footer><span class="foot">● YAMAHA905 GAMING</span><span class="foot">PRESS ANY BUTTON TO WAKE</span></footer></main>
<script>
const statusEl=document.getElementById('status'),$=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function button(i,on){const e=$('button-'+i),t=$('label-'+i);if(e)e.classList.toggle('active',!!on);if(t)t.classList.toggle('active',!!on)}
function dpad(k,on){const e=$('dpad-'+k);if(e)e.classList.toggle('active',!!on)}
function stick(id,x,y){const e=$(id);if(!e)return;const cx=id==='leftStick'?350:600,cy=id==='leftStick'?286:390;e.setAttribute('cx',cx+clamp(x,-1,1)*25);e.setAttribute('cy',cy+clamp(y,-1,1)*25)}
function loop(){const pads=navigator.getGamepads?navigator.getGamepads():[],p=Array.from(pads).find(x=>x&&x.connected);if(!p){statusEl.textContent='● WAITING FOR CONTROLLER';statusEl.classList.remove('on');requestAnimationFrame(loop);return}statusEl.textContent='● CONTROLLER CONNECTED';statusEl.classList.add('on');const b=p.buttons||[];for(let i=0;i<=16;i++)button(i,!!(b[i]&&(b[i].pressed||b[i].value>.5)));dpad('up',!!(b[12]&&b[12].pressed));dpad('down',!!(b[13]&&b[13].pressed));dpad('left',!!(b[14]&&b[14].pressed));dpad('right',!!(b[15]&&b[15].pressed));const a=p.axes||[];stick('leftStick',a[0]||0,a[1]||0);stick('rightStick',a[2]||0,a[3]||0);$('lt-fill').setAttribute('width',120*Math.max(0,Math.min(1,b[6]?.value||0)));$('rt-fill').setAttribute('width',120*Math.max(0,Math.min(1,b[7]?.value||0)));requestAnimationFrame(loop)}
window.addEventListener('gamepadconnected',()=>{statusEl.textContent='● CONTROLLER CONNECTED';statusEl.classList.add('on')});window.addEventListener('gamepaddisconnected',()=>{statusEl.textContent='● CONTROLLER DISCONNECTED';statusEl.classList.remove('on')});if(!navigator.getGamepads)statusEl.textContent='GAMEPAD API NOT SUPPORTED';requestAnimationFrame(loop);
</script></body></html>
